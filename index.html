<!DOCTYPE html>
<html lang="en">
<head>
  <title>Countdown Timer</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/flipdown@0.3.2/dist/flipdown.css" />

  <style>
    :root {
      --bg-light: white;
      --text-light: black;
      --input-bg-light: white;
      --input-border-light: #ccc;
      --btn-bg-light: #333;
      --btn-text-light: white;

      --bg-dark: #191919; /* Match Notion dark */
      --text-dark: white;
      --input-bg-dark: #333;
      --input-border-dark: #555;
      --btn-bg-dark: #ddd;
      --btn-text-dark: #000;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.light {
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    h1, h2 {
      font-weight: 600;
      transition: color 0.3s ease;
    }

    form {
      margin-bottom: 20px;
    }

    input[type="datetime-local"] {
      padding: 8px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid;
      transition: background-color 0.3s ease, color 0.3s ease, border 0.3s ease;
    }

    body.light input,
    body.light button {
      background-color: var(--input-bg-light);
      color: var(--text-light);
      border-color: var(--input-border-light);
    }

    body.dark input,
    body.dark button {
      background-color: var(--input-bg-dark);
      color: var(--text-dark);
      border-color: var(--input-border-dark);
    }

    button {
      padding: 8px 16px;
      font-size: 1rem;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #resetBtn {
      display: none;
      margin-top: 10px;
    }

    #themeToggle {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.9rem;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      text-decoration: underline;
    }

    .flipdown {
      display: inline-flex !important;
      flex-wrap: nowrap !important;
      justify-content: center;
      align-items: center;
      transform: scale(0.85);
      background-color: transparent;
      transition: filter 0.3s ease, background-color 0.3s ease;
    }

    .flipdown .rotor-group {
      margin: 0 5px;
      min-width: 70px;
      flex: none;
    }

    .flipdown .rotor-group:last-child {
      margin-right: 0;
    }

    body.dark .flipdown {
      background-color: #191919;
      filter: invert(1) hue-rotate(180deg);
    }

    body.dark .flipdown .rotor,
    body.dark .flipdown .rotor-top,
    body.dark .flipdown .rotor-bottom {
      background-color: #2a2a2a !important;
      color: white !important;
      border-color: #555 !important;
    }

    @media (max-width: 500px) {
      .flipdown {
        transform: scale(0.7);
      }
      h1 {
        font-size: 1.5rem;
      }
      input[type="datetime-local"],
      button {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <button id="themeToggle">Toggle Theme</button>
  <h1>Launch Date</h1>

  <form id="dateForm">
    <input type="datetime-local" id="userDate" required />
    <button type="submit">Start Countdown</button>
  </form>

  <button type="button" id="resetBtn">Reset Countdown</button>

  <div id="flipdown" class="flipdown"></div>

  <script src="https://unpkg.com/flipdown@0.3.2/dist/flipdown.min.js"></script>

  <script>
    let flipdown;

    function toggleUI(showForm) {
      document.getElementById('dateForm').style.display = showForm ? 'block' : 'none';
      document.getElementById('resetBtn').style.display = showForm ? 'none' : 'inline-block';
    }

    function startCountdown(unixTime) {
      document.getElementById('flipdown').innerHTML = '';
      toggleUI(false);

      flipdown = new FlipDown(unixTime, 'flipdown')
        .start()
        .ifEnded(() => {
          document.getElementById("flipdown").innerHTML = `<h2>Timer is ended</h2>`;
        });
    }

    // THEME HANDLING
    const themeToggle = document.getElementById("themeToggle");

    function applyTheme(theme) {
      document.body.classList.remove("light", "dark");
      document.body.classList.add(theme);
      localStorage.setItem("theme", theme);
    }

    themeToggle.addEventListener("click", () => {
      const newTheme = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(newTheme);
    });

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      applyTheme(savedTheme);
    } else {
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(prefersDark ? "dark" : "light");
    }

    // TIMER LOGIC
    document.addEventListener('DOMContentLoaded', () => {
      const savedDate = localStorage.getItem('countdownDate');
      const form = document.getElementById('dateForm');
      const input = document.getElementById('userDate');
      const resetBtn = document.getElementById('resetBtn');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        let userInput = input.value;

        if (!userInput) {
          alert("Please select a date and time.");
          return;
        }

        const dateObj = new Date(userInput);
        const unixTime = dateObj.getTime() / 1000;

        if (isNaN(unixTime)) {
          alert("Invalid date format. Please make sure you've selected both date and time.");
          return;
        }

        if (unixTime <= Date.now() / 1000) {
          alert("Please choose a future date and time.");
          return;
        }

        localStorage.setItem('countdownDate', userInput);
        startCountdown(unixTime);
      });

      resetBtn.addEventListener('click', () => {
        localStorage.removeItem('countdownDate');
        toggleUI(true);
        document.getElementById('flipdown').innerHTML = '';
      });

      if (savedDate) {
        const savedUnix = new Date(savedDate).getTime() / 1000;
        if (!isNaN(savedUnix) && savedUnix > Date.now() / 1000) {
          input.value = savedDate;
          startCountdown(savedUnix);
          return;
        } else {
          localStorage.removeItem('countdownDate');
        }
      }

      toggleUI(true);
    });
  </script>
</body>
</html>
