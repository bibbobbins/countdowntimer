<script>
  let flipdown;

  function toggleUI(showForm) {
    document.getElementById('dateForm').style.display = showForm ? 'block' : 'none';
    document.getElementById('resetBtn').style.display = showForm ? 'none' : 'inline-block';
  }

  function startCountdown(unixTime) {
    document.getElementById('flipdown').innerHTML = '';
    toggleUI(false); // Hide form, show reset

    flipdown = new FlipDown(unixTime, 'flipdown')
      .start()
      .ifEnded(() => {
        document.getElementById("flipdown").innerHTML = `<h2>Timer is ended</h2>`;
      });
  }

  document.addEventListener('DOMContentLoaded', () => {
    const savedDate = localStorage.getItem('countdownDate');
    const form = document.getElementById('dateForm');
    const input = document.getElementById('userDate');
    const resetBtn = document.getElementById('resetBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const userInput = input.value;
      const dateObj = new Date(userInput);
      const unixTime = dateObj.getTime() / 1000;

      if (!isNaN(unixTime) && unixTime > Date.now() / 1000) {
        localStorage.setItem('countdownDate', userInput);
        startCountdown(unixTime);
      } else {
        alert("Please choose a valid future date and time.");
      }
    });

    resetBtn.addEventListener('click', () => {
      localStorage.removeItem('countdownDate');
      toggleUI(true); // Show form again
      document.getElementById('flipdown').innerHTML = '';
    });

    if (savedDate) {
      const savedUnix = new Date(savedDate).getTime() / 1000;
      if (!isNaN(savedUnix) && savedUnix > Date.now() / 1000) {
        input.value = savedDate; // Prefill input
        startCountdown(savedUnix);
        return;
      } else {
        localStorage.removeItem('countdownDate');
      }
    }

    // If no saved date, show form
    toggleUI(true);
  });
</script>
