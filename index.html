<!DOCTYPE html>
<html lang="en">
<head>
  <title>Launch Date</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

  <!-- FlipDown CSS -->
  <link rel="stylesheet" href="https://unpkg.com/flipdown@0.3.2/dist/flipdown.css" />

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-weight: 600;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    form {
      margin-bottom: 20px;
    }

    input[type="datetime-local"] {
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 8px 16px;
      font-size: 1rem;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      background-color: #333;
      color: white;
      cursor: pointer;
    }

    #resetBtn {
      display: none;
      margin-top: 10px;
    }

    .flipdown {
      display: inline-flex !important;
      flex-wrap: nowrap !important;
      justify-content: center;
      align-items: center;
      transform: scale(0.85);
    }

    .flipdown .rotor-group {
      margin: 0 5px;
      min-width: 70px;
      flex: none;
    }

    .flipdown .rotor-group:last-child {
      margin-right: 0;
    }

    @media (max-width: 500px) {
      .flipdown {
        transform: scale(0.7);
      }
      h1 {
        font-size: 1.5rem;
      }
      input[type="datetime-local"],
      button {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1>Your Launch Date</h1>

  <form id="dateForm">
    <input type="datetime-local" id="userDate" placeholder="YYYY-MM-DDTHH:MM" required />
    <button type="submit">Start Countdown</button>
  </form>

  <button type="button" id="resetBtn">Reset Countdown</button>

  <div id="flipdown" class="flipdown"></div>

  <!-- FlipDown JS -->
  <script src="https://unpkg.com/flipdown@0.3.2/dist/flipdown.min.js"></script>

  <script>
    let flipdown;

    function toggleUI(showForm) {
      document.getElementById('dateForm').style.display = showForm ? 'block' : 'none';
      document.getElementById('resetBtn').style.display = showForm ? 'none' : 'inline-block';
    }

    function startCountdown(unixTime) {
      document.getElementById('flipdown').innerHTML = '';
      toggleUI(false);

      flipdown = new FlipDown(unixTime, 'flipdown')
        .start()
        .ifEnded(() => {
          document.getElementById("flipdown").innerHTML = `<h2>Timer is ended</h2>`;
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedDate = localStorage.getItem('countdownDate');
      const form = document.getElementById('dateForm');
      const input = document.getElementById('userDate');
      const resetBtn = document.getElementById('resetBtn');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const userInput = input.value;
        const dateObj = new Date(userInput);
        const unixTime = dateObj.getTime() / 1000;

        if (!isNaN(unixTime) && unixTime > Date.now() / 1000) {
          localStorage.setItem('countdownDate', userInput);
          startCountdown(unixTime);
        } else {
          alert("Please choose a valid future date and time.");
        }
      });

      resetBtn.addEventListener('click', () => {
        localStorage.removeItem('countdownDate');
        toggleUI(true);
        document.getElementById('flipdown').innerHTML = '';
      });

      if (savedDate) {
        const savedUnix = new Date(savedDate).getTime() / 1000;
        if (!isNaN(savedUnix) && savedUnix > Date.now() / 1000) {
          input.value = savedDate;
          startCountdown(savedUnix);
          return;
        } else {
          localStorage.removeItem('countdownDate');
        }
      }

      toggleUI(true);
    });
  </script>
</body>
</html>
